name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Weekly run against the newest Claude Code: the mod API is early access and can change.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DISABLE_AUTOUPDATER: "1"
      DISABLE_TELEMETRY: "1"
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `claude plugin validate` and `claude plugin test` need no sign-in.
      - run: npm install -g @anthropic-ai/claude-code
      # The type-check is skipped here: Claude Code's API types are only written by a local session.
      - run: npm run check
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reports
          path: reports/
